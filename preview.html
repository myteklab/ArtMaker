<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Maker Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #1a1a1f; }
        #host {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: 0; display: block; opacity: 0; transition: opacity .3s;
        }
        #host.ready { opacity: 1; }

        #am-loading {
            position: absolute; inset: 0; z-index: 30; display: flex;
            align-items: center; justify-content: center;
            background: #1a1a1f; color: #8a8a99;
            font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        /* Bottom LEFT. The canvas is square and centred, so a bottom corner is
           off the art in both frames; the right one is taken by the share
           page's "Made on mytekDev" badge and the modal's close button owns
           the top right. */
        #am-replay {
            position: absolute; left: 12px; bottom: 12px;
            z-index: 20; cursor: pointer; border: 0; border-radius: 999px;
            padding: 8px 18px; background: rgba(10, 10, 14, .82); color: #fff;
            border: 1px solid rgba(255, 255, 255, .18);
            font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        #am-replay:hover { background: rgba(30, 30, 40, .92); }
        #am-shot {
            position: absolute; inset: 0; z-index: 10;
            width: 100%; height: 100%; object-fit: contain;
        }
        .am-gone { display: none !important; }
    </style>
</head>

<body>
    <!-- Read-only art preview for the share page and the gallery modal.
         What a viewer wants on arrival is the finished piece, and the saved
         screenshot already IS that (the adapter captures #artCanvas), so it
         goes up as an image and no canvas work happens at all. Drawing the
         piece for real is not cheap: cost runs with segments x symmetry copies
         x blur radius x canvas AREA, so the same art that renders in 200ms in
         a gallery tile takes seconds in a full-width frame on a Retina display.
         That is a bill to hand someone who asked for it, not someone who
         clicked a link.

         What the screenshot cannot show is the piece being MADE, and Art Maker
         saves a real stroke list rather than a flattened raster. The button
         offers that, and no renderer is duplicated to do it: the app's own
         brush code draws every frame, so symmetry, mirroring, rainbow and glow
         all come along. appendStrokesForPreview hands it the strokes revealed
         since the last step and it draws them onto the buffer already there. -->
    <iframe id="host" src="index.html" title="Art preview"></iframe>
    <img id="am-shot" class="am-gone" alt="" >
    <button id="am-replay" class="am-gone" type="button">&#8635; Replay</button>
    <div id="am-loading">Loading artwork...</div>

    <script>
    (function () {
        'use strict';

        var VIEW_ONLY_CSS = [
            /* The toolbar is the whole editing surface; .canvas-area is flex:1
               so the canvas takes the frame once it is gone. */
            '.toolbar { display: none !important; }',
            '#artCanvas { cursor: default !important; }'
        ].join('\n');

        var REPLAY_MS = 4200;    /* how long a full playback wants to take */
        var STEP_BUDGET_MS = 90; /* most work to do between two paints */
        var MIN_GAP_MS = 16;

        var iframe = document.getElementById('host');
        var shotUrl = '';
        var pending = null;
        var delivered = false;
        var project = null;
        var timers = [];

        function el(id) { return document.getElementById(id); }

        function appWindow() {
            var w;
            try { w = iframe.contentWindow; } catch (e) { return null; }
            if (!w || typeof w.loadProjectData !== 'function') return null;
            if (!w.document.querySelector('.canvas-area')) return null;
            return w;
        }

        function slice(n) {
            return {
                version: project.version || 1,
                state: project.state,
                strokes: project.strokes.slice(0, n)
            };
        }

        function clearTimers() {
            timers.forEach(clearTimeout);
            timers = [];
        }

        function showReplayButton(hasPlayed) {
            var b = el('am-replay');
            b.textContent = hasPlayed ? '\u21BB Replay' : '\u25B6 Watch it drawn';
            b.classList.remove('am-gone');
        }

        /* Reveal strokes up to `to` by drawing only the ones since `from`.
           The fallback is the old quadratic path, reached only if this file
           ships against an index.html without the append hook. */
        function appendThrough(w, from, to) {
            try {
                if (typeof w.appendStrokesForPreview === 'function') {
                    w.appendStrokesForPreview(project.strokes.slice(from, to));
                } else {
                    w.loadProjectData(slice(to));
                }
            } catch (e) {}
        }

        /* Every earlier version of this picked a step count up front from one
           timed redraw, which meant guessing what the rest of the piece would
           cost on a machine and a frame size it had seen exactly one sample of.
           This measures instead: draw a batch, see what it cost, size the next
           batch from that. A step never runs longer than STEP_BUDGET_MS by more
           than the last one's error, and the gap to the next is never shorter
           than the work just done, so there is always room to paint. Dense art
           on a big display simply takes longer to replay rather than taking the
           tab down with it. */
        function play(w) {
            clearTimers();
            var total = project.strokes.length;
            var clock = w.performance || performance;
            var shown = 0;
            var msPerUnit = 0;

            /* Strokes are wildly uneven: one flick of the wrist and one long
               sweep both count as 1, and at symmetry 16 with mirroring each
               segment is drawn 32 times. Batching by stroke count therefore
               overshoots badly on the first long stroke. A segment times its
               copies is the thing that actually costs. */
            function unitsIn(stroke) {
                var sym = stroke.symmetry
                    || (project.state && project.state.symmetry) || 8;
                var copies = sym * (stroke.mirror ? 2 : 1);
                var segs = Math.max(1, (stroke.points || []).length - 1);
                return segs * copies;
            }

            function step() {
                var budget = msPerUnit > 0 ? STEP_BUDGET_MS / msPerUnit : 0;
                var to = shown, taken = 0;
                do {
                    taken += unitsIn(project.strokes[to]);
                    to++;
                } while (to < total && taken + unitsIn(project.strokes[to]) <= budget);

                var t0 = clock.now();
                appendThrough(w, shown, to);
                var spent = clock.now() - t0;
                msPerUnit = spent / Math.max(1, taken);
                shown = to;

                if (shown >= total) { showReplayButton(true); return; }

                /* Aim for REPLAY_MS overall, but never queue the next batch
                   before the browser has had at least as long as the last one
                   took to get a frame out. */
                var left = 0;
                for (var i = shown; i < total; i++) left += unitsIn(project.strokes[i]);
                var stepsLeft = Math.max(1, Math.ceil((left * msPerUnit) / STEP_BUDGET_MS));
                var even = REPLAY_MS / (stepsLeft + 1);
                timers.push(setTimeout(step, Math.max(MIN_GAP_MS, spent, even)));
            }

            timers.push(setTimeout(step, 0));
        }

        function deliver(data) {
            if (delivered) return;
            var w = appWindow();
            if (!w) { pending = data; return; }
            delivered = true;
            project = data;

            try {
                var style = w.document.createElement('style');
                style.textContent = VIEW_ONLY_CSS;
                w.document.head.appendChild(style);
                w.dispatchEvent(new w.Event('resize'));
            } catch (e) {}

            var strokes = (project && project.strokes) || [];

            el('am-replay').addEventListener('click', function () {
                el('am-replay').classList.add('am-gone');
                el('am-shot').classList.add('am-gone');
                try { w.loadProjectData(slice(0)); } catch (e) {}
                play(w);
            });

            function reveal() {
                el('am-loading').classList.add('am-gone');
                iframe.classList.add('ready');
                window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
            }

            /* The screenshot is the finished piece, so showing it costs a
               decode instead of tens of thousands of blurred stroke() calls.
               The canvas stays empty until someone asks for the drawing. */
            if (shotUrl && strokes.length >= 2) {
                var shot = el('am-shot');
                shot.onload = function () { shot.classList.remove('am-gone'); reveal(); };
                shot.onerror = function () { renderStill(); };
                shot.src = shotUrl;
                showReplayButton(false);
                return;
            }

            renderStill();

            /* No screenshot to lean on, so the canvas has to draw it. This is
               the one full render, and it is what any still of this art costs. */
            function renderStill() {
                try { w.loadProjectData(project); }
                catch (e) { console.warn('[artmaker-preview] load failed', e); }
                reveal();
                if (strokes.length >= 2) showReplayButton(false);
            }
        }

        function normalize(data) {
            if (typeof data === 'string') {
                try { return JSON.parse(data); } catch (e) { return null; }
            }
            return (data && typeof data === 'object') ? data : null;
        }

        window.addEventListener('message', function (e) {
            var msg = e.data;
            if (!msg || msg.type !== 'LOAD_PREVIEW') return;
            /* Same-origin storage paths only. The parent is trusted, but this
               value ends up in an img src and a relative path cannot be turned
               into a request somewhere else. */
            if (typeof msg.previewUrl === 'string' && /^\/storage\/[\w./-]+$/.test(msg.previewUrl)) {
                shotUrl = msg.previewUrl;
            }
            var art = normalize(msg.data);
            if (!art || !art.strokes) {
                el('am-loading').classList.add('am-gone');
                iframe.classList.add('ready');
                window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
                return;
            }
            deliver(art);
        });

        var tries = 0;
        (function waitForApp() {
            if (delivered) return;
            if (pending && appWindow()) { deliver(pending); return; }
            if (tries++ < 300) { setTimeout(waitForApp, 50); return; }
            console.warn('[artmaker-preview] app never finished booting');
            el('am-loading').classList.add('am-gone');
            iframe.classList.add('ready');
            window.parent.postMessage({ type: 'PREVIEW_LOADED' }, '*');
        })();

        window.parent.postMessage({ type: 'PREVIEW_READY' }, '*');
    })();
    </script>
</body>

</html>
